<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EncodeKit — Encoder / Decoder Multi-tool</title>
<style>
  :root{--bg:#f3fbfb;--card:#fff;--ink:#0d1b1b;--mut:#577070;--line:#dcebeb;--line2:#d8ebea;--ac:#0891b2;--ac2:#0e7490;--ok:#16a34a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .top{display:flex;align-items:center;gap:12px;padding:22px 28px;background:var(--card);border-bottom:1px solid var(--line2)}
  .logo{width:38px;height:38px}.top h1{margin:0;font-size:20px;letter-spacing:-.02em}.top p{margin:0;color:var(--mut);font-size:13px}
  .wrap{max-width:860px;margin:0 auto;padding:28px 18px 80px}
  .card{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:22px;box-shadow:0 1px 3px #0000000a}
  .ops{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
  .op{padding:8px 13px;border:1px solid var(--line2);border-radius:99px;cursor:pointer;color:var(--mut);font-size:13px;font-weight:600;background:#fff}
  .op.active{background:var(--ac);color:#fff;border-color:transparent}
  .grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
  @media(max-width:680px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:12px;color:var(--mut);margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}
  textarea{width:100%;min-height:200px;border:1px solid var(--line2);border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:13.5px;background:#fbfefe;resize:vertical}
  textarea:focus{outline:2px solid var(--ac)}
  .swap{display:grid;place-items:center}.swap button{background:#e5f4f6;border:1px solid var(--line2);color:var(--ac);border-radius:12px;width:44px;height:44px;cursor:pointer;font-size:18px}
  .bar{display:flex;gap:10px;margin-top:14px;align-items:center}
  button.act{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:#e5f4f6;color:var(--ink);border:0;border-radius:12px;padding:11px 16px;font:inherit;cursor:pointer}
  .muted{color:var(--mut);font-size:13px;margin-left:auto}
</style>
</head>
<body>
<div class="top">
  <svg class="logo" viewBox="0 0 40 40" fill="none"><path d="M16 11l-8 9 8 9M24 11l8 9-8 9" stroke="#0891b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
  <div><h1>EncodeKit</h1><p>Encode &amp; decode Base64, URL, Hex, Binary, ROT13 and HTML — a handy CTF / security utility</p></div>
</div>
<div class="wrap">
  <div class="card">
    <div class="ops" id="ops"></div>
    <div class="grid">
      <div><label>Input</label><textarea id="in" placeholder="type here…" oninput="convert()"></textarea></div>
      <div class="swap"><button onclick="swap()" title="swap">⇄</button></div>
      <div><label id="outLabel">Output</label><textarea id="out" readonly></textarea></div>
    </div>
    <div class="bar">
      <button class="act" onclick="setDir('enc')" id="encBtn">Encode →</button>
      <button class="ghost" onclick="setDir('dec')" id="decBtn">← Decode</button>
      <button class="ghost" onclick="copyOut()">Copy output</button>
      <span class="muted" id="status"></span>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);let op='base64',dir='enc';
const OPS=[["base64","Base64"],["url","URL"],["hex","Hex"],["binary","Binary"],["rot13","ROT13"],["html","HTML entities"]];
$('ops').innerHTML=OPS.map(([k,l])=>`<div class="op ${k==='base64'?'active':''}" data-op="${k}" onclick="setOp('${k}')">${l}</div>`).join('');
function setOp(k){op=k;document.querySelectorAll('.op').forEach(o=>o.classList.toggle('active',o.dataset.op===k));convert()}
function setDir(d){dir=d;$('encBtn').className=d==='enc'?'act':'ghost';$('decBtn').className=d==='dec'?'act':'ghost';convert()}
function swap(){$('in').value=$('out').value;convert()}
function copyOut(){navigator.clipboard&&navigator.clipboard.writeText($('out').value)}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(s.replace(/\s+/g,''))))}
function hexBytes(s){const clean=s.trim().replace(/^0x/i,'').replace(/\s+/g,'');if(!clean||clean.length%2||!/^[\da-f]+$/i.test(clean))throw new Error('invalid hex');return new Uint8Array(clean.match(/.{2}/g).map(b=>parseInt(b,16)))}
function binaryBytes(s){const clean=s.replace(/\s+/g,'');if(!clean||clean.length%8||/[^01]/.test(clean))throw new Error('invalid binary');return new Uint8Array(clean.match(/.{8}/g).map(b=>parseInt(b,2)))}
function rot13(s){return s.replace(/[a-z]/gi,c=>String.fromCharCode((c<='Z'?90:122)>=(c.charCodeAt(0)+13)?c.charCodeAt(0)+13:c.charCodeAt(0)-13))}
function convert(){
  const s=$('in').value;$('status').textContent='';if(!s){$('out').value='';return}
  try{
    let r='';
    if(op==='base64')r=dir==='enc'?b64e(s):b64d(s);
    else if(op==='url')r=dir==='enc'?encodeURIComponent(s):decodeURIComponent(s);
    else if(op==='hex')r=dir==='enc'?[...new TextEncoder().encode(s)].map(b=>b.toString(16).padStart(2,'0')).join(''):new TextDecoder().decode(hexBytes(s));
    else if(op==='binary')r=dir==='enc'?[...new TextEncoder().encode(s)].map(b=>b.toString(2).padStart(8,'0')).join(' '):new TextDecoder().decode(binaryBytes(s));
    else if(op==='rot13')r=rot13(s);
    else if(op==='html')r=dir==='enc'?s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])):s.replace(/&(amp|lt|gt|quot|#39);/g,m=>({'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&#39;':"'"}[m]));
    $('out').value=r;$('outLabel').textContent=(dir==='enc'?'Encoded':'Decoded')+' ('+op+')';
  }catch(e){$('out').value='';$('status').textContent='⚠ invalid input for '+(dir==='dec'?'decoding':'encoding')+' as '+op}
}
setDir('enc');
</script>
</body>
</html>
