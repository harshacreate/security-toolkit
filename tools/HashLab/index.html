<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HashLab — Hashing & Integrity Checker</title>
<style>
  :root{--bg:#f4faf8;--card:#fff;--ink:#0f1a17;--mut:#5a6b66;--line:#dfeae6;--ac:#0d9488;--ac2:#0f766e;--ok:#16a34a;--bad:#dc2626}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .top{display:flex;align-items:center;gap:12px;padding:22px 28px;background:var(--card);border-bottom:1px solid var(--line)}
  .logo{width:38px;height:38px}.top h1{margin:0;font-size:20px;letter-spacing:-.02em}.top p{margin:0;color:var(--mut);font-size:13px}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 1px 3px #0000000a}
  h2{font-size:15px;margin:0 0 14px}label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
  textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;background:#fbfdfc}
  textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
  input:focus,textarea:focus{outline:2px solid var(--ac)}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--mut);cursor:pointer;background:#fbfdfc}
  .drop.over{border-color:var(--ac);color:var(--ac)}.drop input{display:none}
  .hrow{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
  .hrow:last-child{border:0}.alg{font-weight:600;font-size:13px;min-width:78px}
  .dig{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all;color:#0f766e}
  button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:var(--ac2)}button.ghost{background:#e6f4f1;color:var(--ink)}
  .verdict{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:600}
  .v-ok{background:#e7f6ec;color:var(--ok)}.v-bad{background:#fdecec;color:var(--bad)}
  .muted{color:var(--mut);font-size:13px}.tag{font-size:11px;background:#e6f4f1;color:#0f766e;border-radius:99px;padding:3px 9px}
</style>
</head>
<body>
<div class="top">
  <svg class="logo" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="15" stroke="#0d9488" stroke-width="3"/><path d="M14 20c0-3.3 2.7-6 6-6s6 2.7 6 6-2.7 6-6 6M20 26v-6" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
  <div><h1>HashLab</h1><p>Compute cryptographic hashes &amp; verify file integrity — fully in your browser</p></div>
</div>
<div class="wrap">
  <div class="card">
    <h2>Input <span class="tag">text or file</span></h2>
    <label>Drop a file to hash it</label>
    <label class="drop" id="drop"><input type="file" id="file"><b id="dropLabel">Choose or drop a file</b><br><span class="muted">file is read locally, never uploaded</span></label>
    <label>…or type text</label>
    <textarea id="text" placeholder="type or paste text to hash…" oninput="hashText()"></textarea>
    <div id="hashes" style="margin-top:10px"></div>
  </div>
  <div class="card">
    <h2>Integrity check</h2>
    <p class="muted">Paste an expected hash (e.g. a published SHA-256) to confirm a file hasn't been tampered with.</p>
    <input type="text" id="expected" placeholder="paste expected hash…" oninput="compare()">
    <div id="verdict"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const ALGS=[["SHA-1","SHA-1"],["SHA-256","SHA-256"],["SHA-384","SHA-384"],["SHA-512","SHA-512"]];
let current={},requestId=0;
function hex(buf){return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("")}
async function digestAll(bytes,request=++requestId){
  const out={};
  try{for(const[label,alg]of ALGS){out[label]=hex(await crypto.subtle.digest(alg,bytes))}}
  catch{if(request===requestId)$('verdict').innerHTML='<div class="verdict v-bad">Hashing failed in this browser.</div>';return}
  if(request!==requestId)return;
  current=out;render();compare();
}
function render(){
  $('hashes').innerHTML=ALGS.map(([l])=>`<div class="hrow"><span class="alg">${l}</span><span class="dig">${current[l]||'—'}</span></div>`).join('');
}
function hashText(){const request=++requestId;$('dropLabel').textContent='Choose or drop a file';const t=$('text').value;if(!t){current={};render();compare();return}digestAll(new TextEncoder().encode(t),request)}
function wireDrop(){const d=$('drop'),f=$('file');
  d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');if(e.dataTransfer.files[0])doFile(e.dataTransfer.files[0])};
  f.onchange=()=>{if(f.files[0])doFile(f.files[0])};}
function doFile(file){const request=++requestId;$('dropLabel').textContent='📄 '+file.name+' ('+file.size+' bytes)';$('text').value='';const fr=new FileReader();fr.onload=()=>{if(request===requestId)digestAll(fr.result,request)};fr.readAsArrayBuffer(file)}
function compare(){const e=$('expected').value.trim().toLowerCase();if(!e||!current['SHA-256']){$('verdict').innerHTML='';return}
  const match=Object.values(current).some(h=>h.toLowerCase()===e);
  $('verdict').innerHTML=match?'<div class="verdict v-ok">✓ Match — the hash corresponds to this input (integrity confirmed).</div>':'<div class="verdict v-bad">✗ No match — this input does not produce the expected hash.</div>';
}
wireDrop();render();
</script>
</body>
</html>
